<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Key Institute</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/otrologo.png') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="login-card shadow-lg p-4 text-center">
        <div class="logo-container mb-3">
            <div class="logo-box">
                <i class="bi bi-asterisk text-white fs-1"></i>
            </div>
        </div>

        <h2 class="text-white mb-1">Nueva Contraseña</h2>
        <p class="text-secondary small mb-4">Ingresa tu nueva contraseña para acceder</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('reset_password', token=token) }}" method="POST">
            <label class="text-secondary d-block text-start mb-2 small">Nueva Contraseña</label>
            <div class="input-group mb-3">
                <span class="input-group-text bg-transparent border-secondary border-end-0 text-secondary">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" name="password" minlength="6"
                    class="form-control bg-transparent border-secondary border-start-0 text-white"
                    placeholder="Escribe tu nueva contraseña" required>
            </div>

            <label class="text-secondary d-block text-start mb-2 small">Confirmar Contraseña</label>
            <div class="input-group mb-4">
                <span class="input-group-text bg-transparent border-secondary border-end-0 text-secondary">
                    <i class="bi bi-shield-lock"></i>
                </span>
                <input type="password" name="confirm_password" minlength="6"
                    class="form-control bg-transparent border-secondary border-start-0 text-white"
                    placeholder="Vuelve a escribir la contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-4 py-2">
                Restablecer Contraseña <i class="bi bi-check-circle ms-2"></i>
            </button>

            <a href="{{ url_for('login') }}" class="btn-recovery text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio de Sesión
            </a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
