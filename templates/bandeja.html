<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Bandeja de Entrada - Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_profe.css') }}">
</head>

<body>
    <div class="main-content">
        <div class="mb-4">
            <a href="{{ url_for('index') }}" class="text-primary text-decoration-none">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </a>
            <h1 class="fw-bold mt-2">Notificaciones del Docente</h1>
        </div>

        <div class="glass-card">
            {% if respuestas %}
            {% for res in respuestas %}
            <div class="p-3 mb-3 border-bottom border-secondary">
                <div class="d-flex justify-content-between align-items-start">
                    <h5 class="text-primary mb-1"><i class="bi bi-reply-fill"></i> Re: {{ res.titulo_reporte }}</h5>
                    <small class="text-white-50">{{ res.fecha }}</small>
                </div>
                <p class="text-white mb-2">{{ res.mensaje }}</p>
                <div class="d-flex gap-2">
                    <span class="badge bg-success small">Resuelto</span>
                    <span class="text-white-50 small">Por: Prof. Fernando Romero</span>
                </div>
            </div>
            {% endfor %}
            {% else %}
            <div class="text-center py-5">
                <i class="bi bi-envelope-open text-white-50" style="font-size: 3rem;"></i>
                <p class="text-white-50 mt-3">No tienes respuestas nuevas.</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>

</html>
