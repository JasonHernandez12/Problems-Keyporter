<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Key Institute</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/otrologo.png') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="login-card shadow-lg p-4 text-center">
        <div class="logo-container mb-3">
            <div class="logo-box">
                <i class="bi bi-asterisk text-white fs-1"></i>
            </div>
        </div>

        <h2 class="text-white mb-1">Inicio de Sesión</h2>
        <p class="text-secondary small mb-4">Portal de Autenticación</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <label class="text-secondary d-block text-start mb-2 small">Correo institucional</label>
            <div class="input-group mb-4">
                <span class="input-group-text bg-transparent border-secondary border-end-0 text-secondary">
                    <i class="bi bi-envelope"></i>
                </span>
                <input type="email" name="email"
                    class="form-control bg-transparent border-secondary border-start-0 text-white"
                    placeholder="nombre.apellido@keyinstitute.edu.sv" required>
            </div>

            <label class="text-secondary d-block text-start mb-2 small">Contraseña</label>
            <div class="input-group mb-4">
                <span class="input-group-text bg-transparent border-secondary border-end-0 text-secondary">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" name="password"
                    class="form-control bg-transparent border-secondary border-start-0 text-white"
                    placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-4 py-2">Siguiente <i
                    class="bi bi-arrow-right ms-2"></i></button>
        </form>

        <button type="button" class="btn-recovery" data-bs-toggle="modal" data-bs-target="#recoveryModal">
            <i class="bi bi-shield-lock me-1"></i> Conexión protegida / Recuperar contraseña
        </button>
    </div>

    <!-- Modal de Recuperación de Contraseña -->
    <div class="modal fade" id="recoveryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content recovery-modal">
                <div class="modal-header border-0 position-relative">
                    <div class="w-100 text-center">
                        <div class="recovery-icon mb-2">
                            <i class="bi bi-key-fill text-white fs-3"></i>
                        </div>
                        <h5 class="modal-title text-white">Recuperar Contraseña</h5>
                        <p class="text-secondary small mb-0">Te enviaremos un enlace de recuperación a tu correo</p>
                    </div>
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
                        data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body px-4 pb-4">
                    <div id="recovery-alert"></div>

                    <label class="text-secondary d-block text-start mb-2 small">Correo institucional</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-transparent border-secondary border-end-0 text-secondary">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" id="recovery-email"
                            class="form-control bg-transparent border-secondary border-start-0 text-white"
                            placeholder="nombre.apellido@keyinstitute.edu.sv" required>
                    </div>

                    <button type="button" id="recovery-submit" class="btn btn-primary w-100 py-2">
                        <span id="recovery-btn-text">Enviar enlace <i class="bi bi-send ms-2"></i></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/recovery.js') }}"></script>
</body>

</html>
